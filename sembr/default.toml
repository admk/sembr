# Default SemBr configuration;
# copy to $XDG_CONFIG_HOME/sembr/config.toml and edit as needed.
[model]
# Hugging Face model name or local model path.
name = "admko/sembr2023-bert-small"
# Inference backend. "torch" supports CUDA/MPS/CPU through Transformers.
# "mlx" is experimental and supports BERT token classification on Apple Silicon.
backend = "torch"
# CUDA quantization bits; valid values are 4 or 8, and MPS is not supported.
# bits = 4
# Model dtype override, such as "float16" or "bfloat16"; unset uses torch.float32.
# dtype = "float16"
# MLX weight quantization mode. Set to "nvfp4" with model.backend="mlx" to
# reduce linear-layer weight memory using MLX's NVFP4 quantized matmul path.
quantization = "none"

[inference]
# Number of parsed paragraphs to process in each model batch.
batch_size = 8
# Divisor used to compute tiled-inference overlap from the model context length.
overlap_divisor = 8

[optimize]
# Prediction algorithm, supports:
#   argmax, logit_adjustment, greedy_linebreaks, or balanced_linebreaks.
algorithm = "balanced_linebreaks"
preferred_min_tokens_per_line = 8
preferred_max_tokens_per_line = 10
# Penalty weight for line lengths outside the preferred range.
line_length_penalty_weight = 0.05

[format]
# Number of spaces represented by one indentation level.
# Set to "auto" to detect 2-, 4-, or 8-space indents from input.
num_spaces = "auto"
# Indentation unit to emit; valid values are "space", "tab", or "auto".
indent_type = "auto"

[listen]
# API server host checked by clients and bound by --listen.
host = "127.0.0.1"
# API server port checked by clients and bound by --listen.
port = 8384

# Platform-specific overrides are applied after the base defaults.
# Supported table shapes are [platform.<platform>.<section>],
# where <section> is any normal SemBr config section.
# Machine-specific platforms, such as macos-arm64, override generic OS tables.
[platform.macos-arm64.model]
name = "admko/sembr2023-bert-small-nvfp4"
backend = "mlx"
quantization = "nvfp4"
