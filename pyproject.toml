[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sembr"
dynamic = ["version"]
authors = [
  { name="admk" },
]
description = "A semantic linebreaker powered by transformers"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastmcp",
    "flask",
    "magika",
    "mcp[cli]",
    "pydantic",
    "requests",
    "torch; sys_platform == 'darwin' or sys_platform == 'linux'",
    "tqdm",
    "transformers==5.9.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-markdown>=0.3.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]

[project.scripts]
sembr = "sembr.cli:main"

[project.urls]
Homepage = "https://github.com/admk/sembr"
Issues = "https://github.com/admk/sembr/issues"

[project.optional-dependencies]
cuda = [
    "accelerate; sys_platform == 'linux'",
]
test = [
    "pytest",
]
quantization = [
    "accelerate; sys_platform == 'linux'",
    "bitsandbytes; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
mlx = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
train = [
    "accelerate; sys_platform == 'linux'",
    "datasets; sys_platform == 'linux'",
    "evaluate; sys_platform == 'linux'",
    "numpy; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
include = ["sembr", "sembr.*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
sembr = ["default.toml"]

[tool.setuptools.dynamic]
version = {attr = "sembr.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
